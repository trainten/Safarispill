<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Safarispill">
<title>Safarispill 🦁</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<style>
:root{
  --bg:#fbf3df; --ink:#2b2418; --muted:#76694f; --card:#fffdf7;
  --leaf:#2f6b3a; --leaf2:#4f9a52; --sun:#f2b134; --sand:#ead39c; --clay:#c8642c; --sky:#4aa3c7; --pink:#e0609a;
  --ok:#1f9d55; --bad:#d64545; --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:var(--bg);
  background-image:radial-gradient(circle at 90% -5%, #ffd97a 0, transparent 32%),
    radial-gradient(circle at -10% 105%, #cfe7b8 0, transparent 40%);
  background-attachment:fixed;
  max-width:520px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom));}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px}
header h1{font-size:1.3rem;margin:0;line-height:1.15;color:var(--leaf)}
header h1 small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.iconbtn{border:0;background:var(--card);border-radius:50%;width:44px;height:44px;font-size:1.25rem;box-shadow:0 2px 6px #0001;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.stat{background:var(--card);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px #0000000d}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.72rem;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:0 3px 12px #0000000f}
.card h2,.card h3{margin:0 0 8px}
.card h3{font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;font-size:1.08rem;font-weight:700;cursor:pointer;
  background:var(--leaf);color:#fff;box-shadow:0 4px 0 #1f4a27;margin:8px 0;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f4a27}
.btn.sun{background:var(--sun);color:#3b2a00;box-shadow:0 4px 0 #b27f12}
.btn.ghost{background:#fff;color:var(--leaf);box-shadow:0 3px 0 #d8ccb0;border:2px solid #e6dcc2}
.row{display:flex;gap:8px}.row>*{flex:1}
.hero{background:linear-gradient(160deg,#4f9a52,#2f6b3a);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:1.25rem}
.hero p{margin:4px 0;opacity:.95}
.hero .big{font-size:3rem;position:absolute;right:14px;top:8px;opacity:.95}
.mystery{font-size:2.6rem;filter:brightness(0) opacity(.55)}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;background:#fff3d1;color:#6b4a00}
.league{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:6px 10px;font-weight:800;color:#fff}
.lg0{background:#7a8b5a}.lg1{background:#2f7d8f}.lg2{background:#6a3fa0}.lg3{background:#d9741b}.lg4{background:linear-gradient(90deg,#132a6b,#2952c9);}
.ladder{display:flex;flex-direction:column-reverse;gap:5px;margin-top:6px}
.ladder div{display:flex;justify-content:space-between;align-items:center;border-radius:12px;padding:7px 10px;background:#f4ecd6;font-size:.9rem}
.ladder div.on{outline:3px solid var(--sun)}
.ladder div.got{background:#e6f3dc}
.topics{margin:6px 0 0;padding-left:18px}.topics li{margin:2px 0}
/* spørsmål */
.qtop{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;gap:8px}
.tag{border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:800;color:#fff;white-space:nowrap}
.t-matte{background:var(--sky)}.t-norsk{background:var(--clay)}.t-engelsk{background:var(--pink)}.t-tema{background:#b8860b}.t-dyr{background:var(--leaf2)}
.progress{display:flex;gap:4px;margin:4px 0 10px}
.progress i{flex:1;height:9px;border-radius:9px;background:#e7dcc1}
.progress i.ok{background:var(--ok)}.progress i.bad{background:var(--bad)}.progress i.cur{background:var(--sun)}
.prompt{font-size:1.2rem;font-weight:700;line-height:1.35;margin:4px 0 10px}
.visual{text-align:center;margin:6px 0 12px}
.reading{background:#fff8e6;border-left:5px solid var(--sun);border-radius:12px;padding:10px 12px;line-height:1.5;font-size:1.02rem;margin-bottom:10px}
.oppstilt{display:inline-block;font-family:"Courier New",ui-monospace,monospace;font-size:1.7rem;font-weight:700;text-align:right;background:#fff;border-radius:14px;padding:8px 18px;line-height:1.3;box-shadow:inset 0 0 0 2px #eadfc4}
.oppstilt .line{border-top:3px solid var(--ink);margin-top:2px}
.coins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.coin{border-radius:50%;width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-weight:800;background:radial-gradient(circle at 35% 30%,#fff3b0,#d9a520);color:#4a3500;box-shadow:0 2px 0 #9b7410;font-size:.9rem}
.note{border-radius:8px;padding:12px 10px;font-weight:800;color:#fff;font-size:.95rem;box-shadow:0 2px 0 #0003}
.n50{background:#9a7b3c}.n100{background:#b0504b}.n200{background:#3f6aa1}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.choice{border:2px solid #e6dcc2;background:#fff;border-radius:16px;padding:14px 10px;font-size:1.08rem;font-weight:700;cursor:pointer;min-height:58px;font-family:inherit;color:var(--ink)}
.choice.right{background:#dcf5e5;border-color:var(--ok)}
.choice.wrong{background:#fde2e2;border-color:var(--bad)}
.choice:disabled{cursor:default}
.feedback{margin-top:12px;border-radius:16px;padding:12px 14px;font-weight:600}
.feedback.ok{background:#e3f6ea}.feedback.bad{background:#fdecec}
.speak{border:0;background:#fde4ef;border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer;vertical-align:middle;margin-left:6px}
.coins.sm .coin{width:42px;height:42px;font-size:.72rem}
.coins.sm .note{padding:9px 7px;font-size:.8rem}
.blocks{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end;margin:4px 0 8px}
.bgrp{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:100%}
.blocks i,.legend i{display:inline-block}
.bh{width:46px;height:46px;background:#f6a623;background-image:linear-gradient(#0000002a 1px,transparent 1px),linear-gradient(90deg,#0000002a 1px,transparent 1px);background-size:4.6px 4.6px;border:2px solid #b4690e;border-radius:3px}
.bt{width:9px;height:46px;background:#3b82f6;background-image:linear-gradient(#00000035 1px,transparent 1px);background-size:9px 4.6px;border:2px solid #1e40af;border-radius:2px}
.bo{width:9px;height:9px;background:#22c55e;border:2px solid #15803d;border-radius:2px}
.bh.mini{width:14px;height:14px;background-size:1.4px 1.4px}.bt.mini{height:14px;width:5px;background-size:5px 1.4px}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
table.glose{width:100%;border-collapse:collapse}
table.glose td{padding:8px 4px;border-bottom:1px solid #eee3c8;vertical-align:middle}
table.glose td.ge{font-size:1.9rem;width:46px;text-align:center}
table.glose td.gs{width:56px;text-align:right}
table.glose .speak{width:44px;height:44px;margin:0}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:260px;border:0;border-radius:24px;background:#fff;box-shadow:0 4px 14px #0000001a;font-family:inherit;color:var(--ink);cursor:pointer;margin:6px 0 12px}
.flash.back{background:#fde4ef}
.flash .fe{font-size:4.5rem}.flash b{font-size:1.8rem}.flash small{color:var(--muted)}
.btn:disabled{opacity:.45}
.center .speak{width:54px;height:54px;font-size:1.4rem}
/* dyr */
.zoo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.animal{background:var(--card);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px #0000000d;cursor:pointer;border:0;font-family:inherit;color:var(--ink)}
.animal .e{font-size:2.2rem;display:block}
.animal.locked .e{filter:brightness(0) opacity(.25)}
.animal small{display:block;font-size:.78rem;color:var(--muted)}
.animalcard{text-align:center}
.animalcard .e{font-size:5rem;display:block;margin:4px 0}
.animalcard ul{text-align:left;padding-left:20px;line-height:1.45}
.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#confetti span{position:absolute;top:-40px;font-size:1.6rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee3c8;gap:10px}
.toggle select{font-size:1rem;padding:6px;border-radius:10px}
.lv{letter-spacing:2px}
table.hist{width:100%;border-collapse:collapse;font-size:.88rem}
table.hist td{padding:6px 4px;border-bottom:1px solid #eee3c8}
.center{text-align:center}

/* oppstilt addisjon */
.addwrap{margin:2px 0 4px}
.addhint{text-align:center;font-weight:700;font-size:1.02rem;min-height:2.5em;margin:8px 0 10px;color:var(--leaf);line-height:1.35}
.addhint.bad{color:var(--clay)}
.addgrid{display:grid;grid-template-columns:42px repeat(3,minmax(58px,1fr));gap:6px 8px;max-width:320px;margin:0 auto 14px;align-items:center;font-weight:800}
.addlab{font-size:.68rem;color:var(--muted);text-align:center;font-weight:700;letter-spacing:.01em;line-height:1.15}
.addlab.side{text-align:right;padding-right:2px;font-size:.72rem}
.addn,.ansbox,.mentebox{display:flex;align-items:center;justify-content:center;height:54px;border-radius:12px;font-family:"Courier New",ui-monospace,monospace;font-size:2rem;font-weight:800}
.addn{background:#fff;box-shadow:inset 0 0 0 2px #eadfc4}
.addn.empty{background:transparent;box-shadow:none}
.addop{font-size:2rem;text-align:center;line-height:1}
.addline{grid-column:2/-1;height:0;border-top:3px solid var(--ink);margin:2px 0}
.ansbox{background:#fff8e6;box-shadow:inset 0 0 0 2px #e6dcc2;min-height:58px}
.ansbox.on,.mentebox.on{box-shadow:inset 0 0 0 3px var(--sun),0 0 0 3px #f2b13455;background:#fff3c4;animation:pulseOn 1.2s ease-in-out infinite}
.ansbox.ok,.mentebox.ok{background:#dcf5e5;box-shadow:inset 0 0 0 2px var(--ok);animation:none}
.ansbox.shake,.mentebox.shake{animation:shake .4s;background:#fde2e2;box-shadow:inset 0 0 0 2px var(--bad)}
.mentebox{height:36px;font-size:1.2rem;background:#f4ecd6;box-shadow:inset 0 0 0 2px #d8ccb0}
.mentebox.idle{opacity:.4}
.addblank{height:36px}
@keyframes pulseOn{50%{box-shadow:inset 0 0 0 3px var(--sun),0 0 0 6px #f2b13433}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.numpad button{border:2px solid #e6dcc2;border-radius:16px;min-height:62px;font-size:1.65rem;font-weight:800;font-family:inherit;background:#fff;color:var(--ink);box-shadow:0 3px 0 #d8ccb0;cursor:pointer}
.numpad button:active{transform:translateY(2px);box-shadow:0 1px 0 #d8ccb0}
.numpad button:disabled{opacity:.4;cursor:default;transform:none}

.addn.struck{text-decoration:line-through;opacity:.4}
.vekslebtn{display:block;width:100%;max-width:320px;margin:8px auto 0;border:2px solid var(--sun);background:#fff3c4;border-radius:16px;padding:12px;font-size:1.05rem;font-weight:800;font-family:inherit;color:var(--ink);box-shadow:0 3px 0 #b27f12;cursor:pointer}
.vekslebtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b27f12}
.vekslebtn[hidden]{display:none}
.hjelpsetning{text-align:center;font-weight:700;font-size:1.02rem;margin:2px 0 10px;line-height:1.5;color:var(--ink)}
.hjelpsetning .hj{display:inline-block;min-width:1.35em;padding:0 5px;border-bottom:2px solid var(--ink);text-align:center}
.hjelpsetning .hj.ok{background:#dcf5e5;border-radius:6px;border-bottom-color:var(--ok)}
.missrow{display:flex;gap:8px;justify-content:center;margin:8px auto 14px;max-width:320px}
.missrow .ansbox{width:64px}
@media (max-height:700px){
  .numpad button{min-height:52px;font-size:1.45rem}
  .addn,.ansbox{height:46px;min-height:46px;font-size:1.7rem}
  .mentebox{height:32px}
}
</style>
</head>
<body>
<header>
  <h1 id="homeTitle" style="cursor:pointer">Safarispill 🦁<small>Samle dyr og rykk opp i ligaen</small></h1>
  <button class="iconbtn" id="btnSettings" aria-label="Innstillinger">⚙️</button>
</header>
<main id="app"></main>
<div id="confetti"></div>
<script>
/* =====================================================================
   UKENS GLOSER (engelsk) – én liste per tema, koblet til uke i WEEK_CONTENT (gloser: ...)
   words: { e: emoji, en: engelsk, no: norsk }   phrases: { en, no }
   ===================================================================== */
const GLOSER_CLOTHES = {
  tema: "Clothes – klær",
  words: [
    { e:"👕", en:"T-shirt",  no:"t-skjorte" }, { e:"🧶", en:"sweater", no:"genser" },
    { e:"👖", en:"trousers", no:"bukse" },     { e:"👖", en:"jeans",   no:"olabukse / jeans" },
    { e:"💃", en:"skirt",    no:"skjørt" },    { e:"👗", en:"dress",   no:"kjole" },
    { e:"👟", en:"shoes",    no:"sko" },       { e:"🧦", en:"socks",   no:"sokker" },
    { e:"👒", en:"hat",      no:"lue / hatt" },{ e:"🧢", en:"cap",     no:"caps" },
    { e:"🧥", en:"jacket",   no:"jakke" },     { e:"🧣", en:"scarf",   no:"skjerf" },
    { e:"🧤", en:"gloves",   no:"hansker" },   { e:"🥾", en:"boots",   no:"støvler" },
    { e:"🩳", en:"shorts",   no:"shorts" },    { e:"🛌", en:"pyjamas", no:"pysjamas" }
  ],
  phrases: [
    { en:"What are you wearing?", no:"Hva har du på deg?" },
    { en:"I am wearing a red sweater.", no:"Jeg har på meg en rød genser." },
    { en:"What am I wearing?", no:"Hva har jeg på meg?" },
    { en:"She is wearing a blue dress.", no:"Hun har på seg en blå kjole." },
    { en:"He is wearing black boots.", no:"Han har på seg svarte støvler." },
    { en:"Put on your jacket!", no:"Ta på deg jakka!" }
  ]
};

const GLOSER_FOOD = {
  tema: "Eat healthy! – sunn mat",
  words: [
    { e:"🍎", en:"apple",    no:"eple" },      { e:"🍌", en:"banana",   no:"banan" },
    { e:"🥕", en:"carrot",   no:"gulrot" },    { e:"🥦", en:"broccoli", no:"brokkoli" },
    { e:"🍅", en:"tomato",   no:"tomat" },     { e:"🥒", en:"cucumber", no:"agurk" },
    { e:"🍇", en:"grapes",   no:"druer" },     { e:"🍊", en:"orange",   no:"appelsin" },
    { e:"🐟", en:"fish",     no:"fisk" },      { e:"🥚", en:"egg",      no:"egg" },
    { e:"🥛", en:"milk",     no:"melk" },      { e:"💧", en:"water",    no:"vann" },
    { e:"🍞", en:"bread",    no:"brød" },      { e:"🧀", en:"cheese",   no:"ost" },
    { e:"🍬", en:"sweets",   no:"godteri" },   { e:"🍰", en:"cake",     no:"kake" }
  ],
  phrases: [
    { en:"Eat healthy!", no:"Spis sunt!" },
    { en:"I like apples.", no:"Jeg liker epler." },
    { en:"Fruit and vegetables are good for you.", no:"Frukt og grønnsaker er bra for deg." },
    { en:"Can I have some water, please?", no:"Kan jeg få litt vann, takk?" },
    { en:"I eat fish for dinner.", no:"Jeg spiser fisk til middag." },
    { en:"Don't eat too many sweets!", no:"Ikke spis for mye godteri!" },
    { en:"What is your favourite food?", no:"Hva er favorittmaten din?" }
  ]
};

/* =====================================================================
   UKENS TEMA  –  bare temaer (ingen navn eller detaljer fra ukeplanen).
   Spørsmål: FØRSTE svaralternativ er riktig (stokkes i spillet).
   ===================================================================== */
const WEEK_CONTENT = {
  46: {
    label: "Uke 46",
    topics: ["Matte: addisjon og subtraksjon", "Norsk: fakta og kilder", "Naturfag: huden",
             "Engelsk: clothes – What am I wearing?", "Faktatekst: ulven", "Sosialt: si fine ting om deg selv"],
    focus: { matte: "regning", engelsk: "clothes" },
    gloser: GLOSER_CLOTHES,
    questions: [
      { tema:"Faktatekst: ulven", text:"Ulven er et rovdyr. Den bor i en flokk sammen med familien sin. Ulvene jakter sammen og spiser blant annet elg og rådyr. Om natta kan de ule for å snakke med hverandre. Hunden vår er i slekt med ulven.",
        prompt:"Hvem bor ulven sammen med?", choices:["En flokk med familien sin","Helt alene hele livet","Med bjørnene","Med sauene på gården"], explain:"Ulven bor i en flokk, som er familien den hører til." },
      { tema:"Faktatekst: ulven", text:"Ulven er et rovdyr. Den bor i en flokk sammen med familien sin. Ulvene jakter sammen og spiser blant annet elg og rådyr. Om natta kan de ule for å snakke med hverandre. Hunden vår er i slekt med ulven.",
        prompt:"Hvorfor uler ulvene?", choices:["For å snakke med hverandre","Fordi de er sultne på gress","For å skremme bort sola","Fordi de fryser"], explain:"Ulvene uler for å «snakke» med flokken." },
      { tema:"Faktatekst: ulven", text:"Ulven er et rovdyr. Den bor i en flokk sammen med familien sin. Ulvene jakter sammen og spiser blant annet elg og rådyr. Om natta kan de ule for å snakke med hverandre. Hunden vår er i slekt med ulven.",
        prompt:"Hvilket dyr er i slekt med ulven?", choices:["Hunden","Katten","Hesten","Kua"], explain:"Hunden stammer fra ulven for veldig lenge siden." },
      { tema:"Faktatekst: ulven", prompt:"Ulven spiser andre dyr. Hva kaller vi et slikt dyr?", choices:["Et rovdyr","Et husdyr","Et krypdyr","Et insekt"], explain:"Dyr som jakter og spiser andre dyr, kaller vi rovdyr." },
      { tema:"Norsk: fakta og kilder", prompt:"Hva er en faktatekst?", choices:["En tekst som forteller hva som er sant","Et eventyr med troll","Et dikt som rimer","En vits"], explain:"En faktatekst gir oss sann kunnskap om noe." },
      { tema:"Norsk: fakta og kilder", prompt:"Hva er en kilde?", choices:["Stedet du fant informasjonen","Et ord som rimer","Slutten på en historie","En type bokstav"], explain:"En kilde er der du hentet fakta fra, for eksempel en bok eller en nettside." },
      { tema:"Norsk: fakta og kilder", prompt:"Hvor er det lurt å lete etter fakta om ulven?", choices:["I en faktabok om dyr","I en eventyrbok","I en kokebok","I en tegneserie om superhelter"], explain:"En faktabok om dyr er en god kilde." },
      { tema:"Naturfag: huden", prompt:"Hva er det største organet på kroppen?", choices:["Huden","Hjertet","Magen","Øret"], explain:"Huden dekker hele kroppen og er det største organet vi har." },
      { tema:"Naturfag: huden", prompt:"Hva skjer med huden når du er varm, for eksempel etter fotballtrening?", choices:["Du svetter","Du får gåsehud","Huden blir blå","Ingenting"], explain:"Svette kjøler ned kroppen." },
      { tema:"Naturfag: huden", prompt:"Hva får du ofte på armene når du fryser?", choices:["Gåsehud","Fregner","Solbrenthet","Skorpe"], explain:"Gåsehud er små kuler på huden når vi fryser." },

function numWrongs(ans, cands){ const out=uniq(cands.filter(x=>Number.isFinite(x) && x>=0 && x<=1000 && x!==ans));
  let k=1; while(out.length<3){ const c = ans + (k%2? k : -k); if(c>=0 && c<=1000 && !out.includes(c) && c!==ans) out.push(c); k++; }
  return shuffle(out).slice(0,3); }
function noCarryAdd(a,b){ let r=0,p=1; while(a>0||b>0){ r+=((a%10+b%10)%10)*p; a=Math.floor(a/10); b=Math.floor(b/10); p*=10; } return r; }
function noBorrowSub(a,b){ let r=0,p=1; while(a>0||b>0){ r+=Math.abs(a%10-b%10)*p; a=Math.floor(a/10); b=Math.floor(b/10); p*=10; } return r; }

function hasCarry(a,b){ while(a>0&&b>0){ if(a%10+b%10>=10) return true; a=Math.floor(a/10); b=Math.floor(b/10);} return false; }
function hasBorrow(a,b){ while(b>0){ if(a%10<b%10) return true; a=Math.floor(a/10); b=Math.floor(b/10);} return false; }


/* --- MATTE: oppstilt addisjon (siffer for siffer, med og uten mente) --- */
function addCols(a,b){
  const names=["enerne","tierne","hundrerne"], places=["enerplassen","tierplassen","hundrerplassen"];
  const cols=[]; let cin=0;
  for(let i=0;i<3;i++){
    const da=Math.floor(a/Math.pow(10,i))%10, db=Math.floor(b/Math.pow(10,i))%10, sum=da+db+cin;
    cols.push({place:i,a:da,b:db,cin,sum,digit:sum%10,cout:sum>=10?1:0,name:names[i],placeName:places[i]});
    cin=cols[i].cout;
  }
  return cols;
}
function explainAddisjon(a,b){
  const parts=addCols(a,b).map(c=>{
    let t=`På ${c.placeName}: ${c.a} + ${c.b}`;
    if(c.cin) t+=` + ${c.cin} i mente`;
    t+=` = ${c.sum}`;
    if(c.cout && c.place<2) t+=`. Skriv ${c.digit} og ta 1 i mente til ${addCols(a,b)[c.place+1].name}`;
    else t+=`. Skriv ${c.digit}`;
    return t;
  });
  return `${a} + ${b} = ${a+b}. ${parts.join(". ")}.`;
}
function makeOppstiltAddisjon(a,b){
  if(!(a>=100 && a<=999 && b>=0 && b<=999 && a+b<=999)) return genOppstiltAddisjon(2);
  const carry=hasCarry(a,b);
  return { subj:"matte", topic: carry? "oppstilt addisjon (med mente)" : "oppstilt addisjon (uten mente)",
    prompt:"Start med enerne!", answer:String(a+b), choices:[String(a+b)],

function genNoCarryAddends(L){
  for(let t=0;t<80;t++){
    const roll=Math.random(); let a,b;
    if(roll<0.12){ a=ri(100,999); b=0; }
    else if(roll<0.32){
      const place=pick(L===1?[1,10]:[1,10,100,100]);
      const maxD=place===100?8:9, d=ri(1,maxD);
      b=d*place;
      const ad=[ri(1,9),ri(0,9),ri(0,9)];
      if(place===1) ad[2]=ri(0,9-d);
      else if(place===10) ad[1]=ri(0,9-d);
      else ad[0]=ri(1,Math.max(1,9-d));
      a=ad[0]*100+ad[1]*10+ad[2];
    } else {
      const bLen=L===1? pick([1,1,2]) : pick([1,2,2,3]);
      const ad=[ri(1,9),ri(0,9),ri(0,9)], bd=[0,0,0];
      bd[2]=ri(0,9-ad[2]);
      if(bLen>=2) bd[1]=ri(0,9-ad[1]);
      if(bLen>=3) bd[0]=ri(0,9-ad[0]);
      a=ad[0]*100+ad[1]*10+ad[2]; b=bd[0]*100+bd[1]*10+bd[2];
      if(b===0) continue;
    }
    if(a>=100 && a<=999 && b>=0 && a+b<=999 && !hasCarry(a,b)) return [a,b];
  }
  return [177,22];
}
function genCarryAddends(L){
  for(let t=0;t<120;t++){
    const two=L>=4 && Math.random()<.5;
    const bLen=L<=3? pick([1,2,2,3]) : pick([2,2,3,3]);
    const ad=[ri(1,9),ri(0,9),ri(0,9)], bd=[0,0,0];
    const forceOnes=two || Math.random()<.75;
    if(forceOnes){ ad[2]=ri(1,9); bd[2]=ri(10-ad[2],9); }
    else { ad[2]=ri(0,8); bd[2]=ri(0,9-ad[2]); }
    const c1=ad[2]+bd[2]>=10?1:0;
    if(bLen>=2){
      if(two || !forceOnes){
        const need=Math.max(0,10-c1);
        ad[1]=ri(Math.min(9,Math.max(0,need-9)),9);
        const lo=Math.max(0,10-ad[1]-c1);
        if(lo>9) continue;
        bd[1]=ri(lo,9);
      } else { ad[1]=ri(0,9); bd[1]=ri(0,9); }
    } else { bd[1]=0; }
    const c2=ad[1]+bd[1]+c1>=10?1:0;
    if(c2>9) continue;
    if(bLen>=3){
      if(9-c2<1) continue;
      ad[0]=ri(1,9-c2); bd[0]=ri(0,9-ad[0]-c2);
    } else {
      bd[0]=0;
      if(ad[0]+c2>9){ if(9-c2<1) continue; ad[0]=ri(1,9-c2); }
    }
    const a=ad[0]*100+ad[1]*10+ad[2], b=bd[0]*100+bd[1]*10+bd[2];
    if(a>=100 && a<=999 && b>=0 && a+b<=999 && hasCarry(a,b)) return [a,b];
  }
  return [178,25];
}
function genOppstiltAddisjon(L, force){
  let carry;
  if(force===true) carry=true;
  else if(force===false) carry=false;
  else if(L<=2) carry=false;
  else if(L===3) carry=Math.random()<.4;
  else if(L===4) carry=Math.random()<.7;
  else carry=Math.random()<.85;
  const [a,b]= carry? genCarryAddends(L) : genNoCarryAddends(L);
  return makeOppstiltAddisjon(a,b);
}

function isSimpleBorrow(a,b){
  const ao=a%10, bo=b%10, at=Math.floor(a/10)%10, bt=Math.floor(b/10)%10, ah=Math.floor(a/100), bh=Math.floor(b/100);
  return ao<bo && at>=1 && (at-1)>=bt && ah>=bh;
}
function subCols(a,b){
  const names=["enerne","tierne","hundrerne"], places=["enerplassen","tierplassen","hundrerplassen"];
  const A=[a%10, Math.floor(a/10)%10, Math.floor(a/100)%10];
  const B=[b%10, Math.floor(b/10)%10, Math.floor(b/100)%10];
  const work=A.slice(), cols=[];
  for(let i=0;i<3;i++){
    const shown=work[i], db=B[i], needBorrow=shown<db;
    if(needBorrow){ work[i+1]-=1; work[i]+=10; }
    const used=work[i], digit=used-db;
    cols.push({place:i, a:A[i], b:db, shown, needBorrow, used, digit,
      newNeighbor: needBorrow? work[i+1] : null,
      fromUnit: i===0? "tier" : "hundrer",
      name:names[i], placeName:places[i]});
  }
  return cols;
}
function hjelpSetning(n){
  const h=Math.floor(n/100), t=Math.floor(n/10)%10, o=n%10;
  return grammar(`Det er ${h} hundrere, ${t} tiere og ${o} enere igjen`);
}
function hjelpHTML(h,t,o){

  let s=`Det er ${box(h,"hj-h")} hundrere, ${box(t,"hj-t")} tiere og ${box(o,"hj-o")} enere igjen.`;
  if(h===1) s=s.replace(" hundrere"," hundrer");
  if(t===1) s=s.replace(" tiere"," tier");
  if(o===1) s=s.replace(" enere"," ener");

}
function explainSubtraksjon(a,b){
  const parts=subCols(a,b).map(c=> c.needBorrow
    ? `På ${c.placeName}: ${c.shown} − ${c.b} går ikke. Veksle: ${c.used} − ${c.b} = ${c.digit}. Skriv ${c.digit}`
    : `På ${c.placeName}: ${c.shown} − ${c.b} = ${c.digit}. Skriv ${c.digit}`);
  const ans=a-b;

function makeOppstiltSubtraksjon(a,b,story,extraExplain){

    else if(L===4){ if(add){ a=ri(120,880); b=ri(15,99);} else { a=ri(150,990); b=ri(15,99);} }
    else { if(add){ a=ri(120,700); b=ri(110,980-a);} else { a=ri(300,999); b=ri(110,a-50);} }
  } while(tries<60 && !(add ? hasCarry(a,b) && a+b<=1000 : (hasBorrow(a,b) && a-b>0)));
  const ans = add? a+b : a-b, op = add? "+" : "−";
  const wrong = add ? [noCarryAdd(a,b), ans+10, ans-10, ans+1, ans-1, L>=4?ans+100:ans+2]

  const opp = forceOppstilt || L>=3;
  return mk("matte", opp?"oppstilt":"regning", opp? "Regn ut:" : `Hva er ${a} ${op} ${b}?`, ans, numWrongs(ans, wrong),
    { visual: opp? oppstiltHTML(a,op,b) : "", explain: add? `${a} + ${b} = ${ans}. Husk mente når enerne blir 10 eller mer.` : `${a} − ${b} = ${ans}. Husk å veksle når du ikke har nok enere.` });
}

function genFinnFeil(L){

  if(k===3){ let a,b,showA,showB;

  if(k===4){ const base=threeDigit(); const s=String(base); let nums=uniq([base, Number(s[1]+s[0]+s[2]), Number(s[0]+s[2]+s[1]), Number(s[2]+s[1]+s[0])]).slice(0,3);

  if(k===5){ const v = L<=3 ? pick([

      ()=>{ const t=ri(2,5), o=ri(11,19); return [`${t} tiere og ${o} enere = ?`, t*10+o, [t*10+o-10, t+o, t*10+o+10]]; } ])()
    : pick([
      ()=>{ const h=ri(1,5), t=ri(11,19); return [`${h} hundrere og ${t} tiere = ?`, h*100+t*10, [h*100+t, h*100+t*10-100, h*100+t*10+100]]; },
      ()=>{ const n=ri(3,9)*100+ri(1,9)*10; return [`Hvor mange tiere er det til sammen i ${n}?`, n/10, [Math.floor(n/10)%10, Math.floor(n/100), n/10+10]]; },
      ()=>{ const h=ri(2,6), t=ri(1,8), o=ri(12,25); return [`${h} hundrere, ${t} tiere og ${o} enere = ?`, h*100+t*10+o, [h*100+t*10+o-10, h*100+t*10+o+10, h*100+(t+o)]]; } ])();
    return mk("matte","veksling",v[0], v[1], numWrongs(v[1], v[2]), {explain:`Husk: 10 enere = 1 tier, og 10 tiere = 1 hundrer. Svaret er ${v[1]}.`}); }
  if(k===6){ const h= L<=3? ri(1,3) : ri(2,6), t= L<=3? ri(1,6) : ri(4,9), o= L<=3? ri(1,7) : ri(3,9);

    return mk("matte","veksling i minus",`${a} = ${Math.floor(a/10)-1} tiere og ? enere`, a%10+10, numWrongs(a%10+10,[a%10, a%10+1, 10, a%10+20]),

  let a,b; do{ a=ri(301,905); b=ri(102,a-50); }while(!(a%10<b%10) || Math.floor(a/10)%10===0);

/* --- MATTE: tallinje --- */
function numberLineSVG(o){
  // o: {lo, step, n, labels:[...], target, start, hops:[...positions]}
  const W=340, pad=20, y=62, hi=o.lo+o.step*o.n, X=v=> pad + (v-o.lo)/(hi-o.lo)*(W-2*pad);
  let s=`<svg viewBox="0 0 ${W} 100" width="100%" style="max-width:420px" role="img" aria-label="Tallinje">`;
  s+=`<line x1="${pad-12}" y1="${y}" x2="${W-pad+12}" y2="${y}" stroke="#2b2418" stroke-width="2.5"/>`;
  s+=`<path d="M${W-pad+14} ${y} l-8 -5 v10 z" fill="#2b2418"/>`;
  for(let i=0;i<=o.n;i++){ const v=o.lo+i*o.step, lab=o.labels.includes(v);
    s+=`<line x1="${X(v)}" y1="${y-(lab?10:6)}" x2="${X(v)}" y2="${y+(lab?10:6)}" stroke="#2b2418" stroke-width="${lab?2.5:1.5}"/>`;
    if(lab) s+=`<text x="${X(v)}" y="${y+27}" font-size="${String(v).length>=4?11:13}" font-weight="700" text-anchor="middle" fill="#2b2418">${v}</text>`; }
  if(o.hops){ let prev=o.start; s+=`<circle cx="${X(o.start)}" cy="${y}" r="5" fill="#2f6b3a"/>`;
    o.hops.forEach(p=>{ const x1=X(prev), x2=X(p), mid=(x1+x2)/2, h=Math.min(30, Math.abs(x2-x1)*.7+8);
      s+=`<path d="M${x1} ${y-3} Q${mid} ${y-3-h*1.6} ${x2} ${y-3}" fill="none" stroke="#c8642c" stroke-width="2.2"/>`;
      s+=`<circle cx="${x2}" cy="${y-3}" r="2.5" fill="#c8642c"/>`; prev=p; }); }
  if(o.target!==undefined){ const x=X(o.target);
    s+=`<path d="M${x} ${y-4} l-7 -12 h14 z" fill="#e0609a"/><text x="${x}" y="${y-22}" font-size="18" font-weight="800" text-anchor="middle" fill="#e0609a">?</text>`; }
  return s+`</svg>`;
}
function genTallinje(L){
  const hop = Math.random()<.45;
  if(!hop){
    const cfg = pick([
      [ {lo:0,step:1,n:20,lab:5}, {lo:0,step:10,n:10,lab:5}, {lo:0,step:2,n:10,lab:5} ],
      [ {lo:ri(1,8)*10,step:1,n:10,lab:5}, {lo:0,step:5,n:10,lab:2}, {lo:0,step:10,n:10,lab:5} ],
      [ {lo:0,step:100,n:10,lab:5}, {lo:ri(1,8)*100,step:10,n:10,lab:5}, {lo:0,step:5,n:20,lab:4} ],
      [ {lo:ri(10,90)*10,step:1,n:10,lab:5}, {lo:ri(1,8)*100,step:10,n:10,lab:10}, {lo:0,step:50,n:20,lab:10}, {lo:ri(0,5)*100,step:20,n:10,lab:5} ],
      [ {lo:ri(1,8)*100,step:10,n:10,lab:10}, {lo:0,step:50,n:20,lab:10}, {lo:ri(10,90)*10,step:2,n:10,lab:10}, {lo:ri(0,4)*100,step:50,n:10,lab:10} ]
    ][L-1]);
    const labels=[]; for(let i=0;i<=cfg.n;i+=cfg.lab) labels.push(cfg.lo+i*cfg.step);
    let idx; do{ idx=ri(1,cfg.n-1); }while(idx%cfg.lab===0);
    const ans=cfg.lo+idx*cfg.step;
    const stepTxt = cfg.step===1? "én" : cfg.step;
    return mk("matte","tallinje","Hvilket tall peker pilen på?", ans, numWrongs(ans,[ans+cfg.step, ans-cfg.step, ans+1, ans-1, ans+2*cfg.step, cfg.lo+idx]),
      {visual:numberLineSVG({lo:cfg.lo, step:cfg.step, n:cfg.n, labels, target:ans}), explain:`Hvert lille steg på tallinja er ${stepTxt}. Tell fra ${labels.filter(v=>v<ans).pop()}: svaret er ${ans}.`});
  }
  // hopp på tallinja
  const H = [ [1,[1,0,20]], [10,[10,0,100]], [pick([10,100]),[10,0,300]], [pick([10,100]),[100,0,1000]], [pick([10,100]),[10,0,1000]] ][L-1];
  const size=H[0]; const k = ri(2, L===1?5:6); const back = L>=2 && Math.random()<.4;
  let start; const maxV = size===1?20 : size===10 ? (L<=2?100:1000) : 1000;
  do{ start = size===1? ri(0,15) : size===10? (L<=2? ri(0,9)*10 : ri(1,9)*100+ri(0,9)*10+(L>=4?ri(0,9):0)) : ri(1,9)*100+(L>=4? ri(0,9)*10:0); }
  while(back? start-k*size<0 : start+k*size>maxV);
  if(L===2) start = back? ri(k,10)*10 : ri(0,10-k)*10;
  const end = back? start-k*size : start+k*size;
  const hops = Array.from({length:k},(_,i)=> back? start-(i+1)*size : start+(i+1)*size);
  const n=10; let lo = Math.min(start,end) - size*ri(0,Math.max(0,8-k)); lo=Math.min(lo, Math.max(0, maxV-n*size)); lo=Math.max(0, Math.min(lo, Math.min(start,end)));
  const word = {1:["ener","enere"],10:["tier","tiere"],100:["hundrer","hundrere"]}[size];
  const prompt = `Start på ${start}. Hopp ${k} ${k===1?word[0]:word[1]} ${back?"tilbake":"fram"}. Hvor lander du?`;
  return mk("matte","hopp på tallinja",prompt, end, numWrongs(end,[end+size, end-size, back? start+k*size : start-k*size, back? start-k : start+k, end+1].filter(x=>x<=1000)),
    {visual:numberLineSVG({lo, step:size, n, labels:[start], start, hops:hops.slice(0,-1).concat([end]), target:end}),
     explain:`${start} ${back?"−":"+"} ${k} ${word[1]} (${k*size}) = ${end}.`});
}

/* --- MATTE: klokka --- */
const HW = ["tolv","ett","to","tre","fire","fem","seks","sju","åtte","ni","ti","elleve"];
function timePhrase(h,m){ const H=HW[h%12], N=HW[(h+1)%12];
  return {0:`klokka ${H}`,5:`fem over ${H}`,10:`ti over ${H}`,15:`kvart over ${H}`,20:`ti på halv ${N}`,25:`fem på halv ${N}`,30:`halv ${N}`,
          35:`fem over halv ${N}`,40:`ti over halv ${N}`,45:`kvart på ${N}`,50:`ti på ${N}`,55:`fem på ${N}`}[m]; }
function clockSVG(h,m){
  const ha=((h%12)+m/60)*30, ma=m*6; let ticks="";
  for(let i=0;i<12;i++){ const a=i*30*Math.PI/180, x=50+38*Math.sin(a), y=50-38*Math.cos(a); ticks+=`<text x="${x}" y="${y+4}" font-size="10" text-anchor="middle" fill="#2b2418" font-weight="700">${i===0?12:i}</text>`; }
  return `<svg viewBox="0 0 100 100" width="170" height="170" role="img" aria-label="Klokke"><circle cx="50" cy="50" r="47" fill="#fff" stroke="#2f6b3a" stroke-width="4"/>${ticks}
   <line x1="50" y1="50" x2="${50+22*Math.sin(ha*Math.PI/180)}" y2="${50-22*Math.cos(ha*Math.PI/180)}" stroke="#2b2418" stroke-width="5" stroke-linecap="round"/>
   <line x1="50" y1="50" x2="${50+33*Math.sin(ma*Math.PI/180)}" y2="${50-33*Math.cos(ma*Math.PI/180)}" stroke="#c8642c" stroke-width="3" stroke-linecap="round"/>
   <circle cx="50" cy="50" r="3.5" fill="#2b2418"/></svg>`;
}
function genKlokke(L){
  const mins = L===1?[0,30]: L===2?[0,15,30,45]:[0,5,10,15,20,25,30,35,40,45,50,55];
  const h=ri(1,12), m=pick(mins), ans=timePhrase(h,m);
  if(L>=5){ // tid som går
    const sh=ri(1,10), sm=pick([0,15,30,45]); const durs=[[15,"et kvarter"],[30,"en halvtime"],[45,"tre kvarter"],[60,"én time"],[75,"en time og et kvarter"],[90,"halvannen time"]];
    const [dm,dt]=pick(durs); const tot=sh*60+sm+dm, eh=Math.floor(tot/60), em=tot%60; const end=timePhrase(eh,em);
    const act=pick(["Fotballtreningen","Dansetimen","Filmen","Kampen"]);
    const wr=[timePhrase(eh+1,em), timePhrase(eh, (em+15)%60), timePhrase(eh-1>0?eh-1:12,em), timePhrase(sh,(sm+30)%60)];
    return mk("matte","klokka",`${act} starter ${timePhrase(sh,sm)} og varer i ${dt}. Når er den ferdig?`, end, wr, {explain:`${timePhrase(sh,sm)} + ${dt} = ${end}.`});
  }
  const cands=[]; cands.push(timePhrase(h+1,m)); cands.push(timePhrase(h+11,m));
  mins.filter(x=>x!==m).forEach(x=>cands.push(timePhrase(h,x)));
  cands.push(timePhrase(h,(m+30)%60)); if(m===30) cands.push(`halv ${HW[h%12]}`);
  const digital = L>=4 && Math.random()<.6;
  const hh = (L>=4 && Math.random()<.5) ? h+12 : h;
  return mk("matte","klokka", digital? `Klokka er ${String(hh===24?12:hh).padStart(2,"0")}:${String(m).padStart(2,"0")}. Hvordan sier vi det?` : "Hva er klokka?", ans,
    shuffle(cands), { visual: digital? "" : clockSVG(h,m), explain:`Den lille viseren viser timene, den store viser minuttene. Svaret er «${ans}».` });
}

function moneyHTML(items,sm){ return `<div class="coins${sm||items.length>6?" sm":""}">${items.map(v=> v>=50? `<span class="note n${v}">${v} kr</span>` : `<span class="coin">${v} kr</span>`).join("")}</div>`; }
function genPenger(L){

  }

  let it; do{ it=shuffle(shop).slice(0,3); }while(it.reduce((x,y)=>x+y[1],0)>480);

}

function genTekst(L){

    ()=>[`På dansekonkurransen er det ${a} dansere i den ene gruppa og ${b} i den andre. Hvor mange dansere er det?`, a+b, "+"],
    ()=>{ const x=Math.max(a,b)+ri(5,30), y=Math.min(a,b); return [`Det var ${x} tilskuere på kampen. ${y} gikk hjem i pausen. Hvor mange var igjen?`, x-y, "−", x, y]; },
    ()=>{ const x=Math.max(a,b)+ri(5,30), y=Math.min(a,b); return [`Laget har scoret ${y} mål denne sesongen. Målet er ${x} mål. Hvor mange mål mangler?`, x-y, "−", x, y]; },
    ()=>{ const x=Math.max(a,b)+ri(5,30), y=Math.min(a,b); return [`En serie har ${x} episoder. Du har sett ${y}. Hvor mange episoder er det igjen?`, x-y, "−", x, y]; }

}
function genMatte(L, opts={}){
  const w = W(); const focus = w && w.focus && w.focus.matte;
  const pool = ["pm","pm","pm","plass","plass","plass","linje","linje","klokka","penger","tekst","addisjon","addisjon"];
  if(focus==="regning"||focus==="oppstilt"||focus==="subtraksjon") pool.push("regning","regning","addisjon","addisjon");
  if(focus==="tresifret"){
    const t = opts.topic || pick(["subtraksjon","subtraksjon","subtraksjon","mangler","mangler","tekstsub","tekstsub"]);
    if(t==="subtraksjon") return genOppstiltSubtraksjon(L);
    if(t==="mangler") return genManglerTall(L);
    return genTekstSubtraksjon(L);
  }
  const t = opts.topic || pick(pool);
  if(t==="addisjon") return genOppstiltAddisjon(L);
  if(t==="pm") return genPlussMinus(L);
  if(t==="regning") return genRegning(L, (focus==="oppstilt"||focus==="subtraksjon") && L>=2, focus==="subtraksjon");
  if(t==="plass") return genPlassverdi(L);
  if(t==="linje") return genTallinje(L);
  if(t==="klokka") return genKlokke(L);
  if(t==="penger") return genPenger(L);
  return genTekst(L);
}

function genRettskriv(L){ const [r,...f]=pick(RETTSKRIV); return mk("norsk","rettskriving","Hvilket ord er skrevet riktig?", r, f, {n:3, explain:`Vi skriver «${r}».`}); }
function genOrdklasse(L){
  const navn={S:"substantiv (navn på ting, dyr eller folk)",V:"verb (noe vi gjør)",A:"adjektiv (forteller hvordan noe er)"}, kort={S:"substantivet",V:"verbet",A:"adjektivet"};
  if(L<=2){ const k=pick(["S","V","A"]); const src={S:ORD_SUBST,V:ORD_VERB,A:ORD_ADJ}; const ans=pick(src[k]);
    const others=shuffle([...["S","V","A"].filter(x=>x!==k).flatMap(x=>src[x])]).slice(0,3);
    return mk("norsk","ordklasser",`Hvilket ord er et ${navn[k]}?`, ans, others, {explain:`«${ans}» er et ${navn[k].split(" ")[0]}.`}); }
  const sent=pick(SETNINGER).split(" ").map(t=>t.split(":")); const k=pick(uniq(sent.map(t=>t[1]).filter(x=>x!=="-")));
  const ans=pick(sent.filter(t=>t[1]===k))[0]; const wr=sent.filter(t=>t[1]!==k).map(t=>t[0]);
  const txt=sent.map(t=>t[0]).join(" ")+".";
  return mk("norsk","ordklasser",`Hvilket ord er ${kort[k]} i setningen?<br><span class="muted">«${esc(txt.charAt(0).toUpperCase()+txt.slice(1))}»</span>`, ans, shuffle(wr), {explain:`«${ans}» er ${kort[k]}.`});
}
function genAlfa(L){
  const pool=uniq(ALFA_ORD); let words;
  if(L>=3){ const s=pick(["s","k"]); words=shuffle(pool.filter(w=>w[0]===s)).slice(0,4); }
  else words=shuffle(pool.filter(w=>!"æøå".includes(w[0]))).filter((w,i,a)=>a.findIndex(x=>x[0]===w[0])===i).slice(0, L===1?3:4);
  if(L>=4 && Math.random()<.5) words=shuffle(pool.filter(w=>"æøåuvt".includes(w[0]))).filter((w,i,a)=>a.findIndex(x=>x[0]===w[0])===i).slice(0,4);
  const last = L>=4 && Math.random()<.5;
  const sorted=words.slice().sort((a,b)=>a.localeCompare(b,"nb"));
  const ans= last? sorted[sorted.length-1] : sorted[0];
  return mk("norsk","alfabetet",`Hvilket ord kommer ${last?"SIST":"FØRST"} i alfabetet?`, ans, words.filter(w=>w!==ans), {n:words.length, explain:`Alfabetisk: ${sorted.join(", ")}. Husk at æ, ø og å kommer helt til slutt.`});
}
function genLesing(L){
  const texts=LESETEKSTER.filter(t=>t.lvl<=L && t.lvl>=L-1); const t=pick(texts.length?texts:LESETEKSTER); const [q,ch]=pick(t.q);
  return mk("norsk","leseforståelse",q, ch[0], ch.slice(1), {visual:`<div class="reading">${esc(t.text)}</div>`, explain:`Svaret står i teksten: «${ch[0]}».`, readText:t.text});
}
function genStorBokstav(){
  const n1=pick(["Ida","Nora","Ella","Sofie"]), n2=pick(["Leo","Jonas","Emil","Noah"]), by=pick(["Oslo","Tromsø","Bergen","Trondheim"]);
  const r=`${n1} og ${n2} spiller fotball i ${by}.`;
  return mk("norsk","store bokstaver","Hvilken setning er skrevet riktig?", r, [`${n1.toLowerCase()} og ${n2} spiller fotball i ${by.toLowerCase()}.`, `${n1} og ${n2.toLowerCase()} spiller Fotball i ${by}.`, `${n1} og ${n2} spiller fotball i ${by.toLowerCase()}`], {explain:"Navn på personer og steder har stor bokstav. Setningen slutter med punktum.", wide:true});
}
function genNorsk(L){
  const pool = L===1? [genDobbel,genRettskriv,genOrdklasse,genAlfa,genLesing]
             : [genDobbel,genRettskriv,genOrdklasse,genAlfa,genLesing,genLesing, ...(L>=3?[genStorBokstav]:[])];
  return pick(pool)(L);
}

/* --- ENGELSK --- */
function enNum(n){ return n<=20? EN_NUMBERS[n] : EN_TENS[n]; }
function pairQ(list, topic){ const p=pick(list); const toEn=Math.random()<.5; const wr=shuffle(list.filter(x=>x!==p)).slice(0,3);
  return toEn ? mk("engelsk",topic,`Hva heter «${esc(p[1])}» på engelsk?`, p[0], wr.map(x=>x[0]), {say:p[0], explain:`${p[1]} = ${p[0]}`})
              : mk("engelsk",topic,`Hva betyr «${esc(p[0])}»?`, p[1], wr.map(x=>x[1]), {say:p[0], explain:`${p[0]} = ${p[1]}`, sayInPrompt:true}); }
function genEngelsk(L){
  const w=W(); const focusClothes = !!(w && w.focus && (w.focus.engelsk==="clothes" || (w.focus.engelsk && w.gloser)));
  const types = [["colors",1],["numbers",1],["animals",2],["body",2],["clothes",focusClothes?1:3],["hobby",3],["phrases",3],["sentences",4],["grammar",5]]
    .filter(t=>t[1]<=L).map(t=>t[0]);
  if(focusClothes) types.push("clothes");
  const t=pick(types);
  if(t==="colors") return pairQ(EN_COLORS,"farger");
  if(t==="body") return pairQ(EN_BODY,"kroppen");
  if(t==="clothes") return pairQ(w && w.gloser ? w.gloser.words.map(x=>[x.en,x.no]) : EN_CLOTHES, w && w.gloser ? "ukens gloser" : "klær");
  if(t==="hobby") return pairQ(EN_HOBBY,"fritid");
  if(t==="phrases") return pairQ(EN_PHRASES,"fraser");
  if(t==="animals"){ const list=ANIMALS.map(a=>[a.en,a.no,a.e]); const p=pick(list); const wr=shuffle(list.filter(x=>x!==p)).slice(0,3);
    return mk("engelsk","dyr",`${p[2]} Hva heter «${p[1]}» på engelsk?`, p[0], wr.map(x=>x[0]), {say:p[0], explain:`${p[1]} = ${p[0]}`}); }
  if(t==="numbers"){ const n = L===1? ri(1,10) : (Math.random()<.5? ri(11,20) : pick([30,40,50,60,70,80,90,100]));
    const near = n<=20? [n+1,n-1,n+2,n+10>20?n-10:n+10].filter(x=>x>=0&&x<=20) : [n+10,n-10,n/10+10].filter(x=>EN_TENS[x]||x<=20);
    const wr = uniq(near).filter(x=>x!==n).map(enNum).filter(Boolean);
    while(wr.length<3){ const x=enNum(ri(1,20)); if(x!==enNum(n) && !wr.includes(x)) wr.push(x); }
    return mk("engelsk","tall",`Hvordan skriver du tallet ${n} på engelsk?`, enNum(n), wr, {say:enNum(n), explain:`${n} = ${enNum(n)}`}); }
  if(t==="sentences"){ const s=pick(EN_SENTENCES); return mk("engelsk","setninger",`Hva betyr: «${s[0]}»`, s[1], s.slice(2), {say:s[0], wide:true, explain:`${s[0]} = ${s[1]}`, sayInPrompt:true}); }
  const g=pick(EN_GRAMMAR); return mk("engelsk","grammatikk",`Hvilket ord passer? «${g[0].replace("___","____")}»`, g[1], g.slice(2), {n:3, explain:g[0].replace("___",g[1]), say:g[0].replace("___",g[1])});
}

function genTema(used){
  const w=W(); const qs=(w&&w.questions)||[]; const fresh=qs.filter(q=>!used.has(q.prompt)); const q=pick(fresh.length?fresh:qs);
  if(!q) return genNorsk(S.lvl.norsk);
  return mk("tema",q.tema,esc(q.prompt),q.choices[0],q.choices.slice(1),{visual:q.text?`<div class="reading">${esc(q.text)}</div>`:"", explain:q.explain||"", say:q.say, sayInPrompt:!!q.say, wide:q.choices.some(c=>c.length>18)});
}
const DEF = {rev:"reven",lowe:"løven",pingvin:"pingvinen",sjiraff:"sjiraffen",ulv:"ulven",panda:"pandaen",isbjorn:"isbjørnen",kenguru:"kenguruen",
  delfin:"delfinen",elg:"elgen",elefant:"elefanten",papegoye:"papegøyen",bjorn:"brunbjørnen",sebra:"sebraen",koala:"koalaen",tiger:"tigeren",
  flamingo:"flamingoen",oter:"oteren",krokodille:"krokodillen",ugle:"ugla",gorilla:"gorillaen",sel:"selen",kamel:"kamelen",hval:"hvalen",
  dovendyr:"dovendyret",skilpadde:"skilpadden",pinnsvin:"pinnsvinet",neshorn:"neshornet",blekksprut:"blekkspruten",orn:"ørna"};
const ART = {dovendyr:"et",pinnsvin:"et",neshorn:"et",ugle:"ei",orn:"ei"};
const STEM = {bjorn:"bjørn",lowe:"løv",papegoye:"papegøy",krokodille:"krokodill",skilpadde:"skilpadd",ugle:"ugl"};
function defOf(a){ return DEF[a.id]||a.no; }
function artOf(a){ return (ART[a.id]||"en")+" "+a.no; }
function maskAnimal(f,a){ const stem=(STEM[a.id]||a.no).toLowerCase();
  return f.split(/(\s+)/).map(t=> t.toLowerCase().includes(stem) ? t.replace(/[^.,!?«»–]+/,"___") : t).join(""); }
function borKey(b){ return b.toLowerCase().slice(0,4); }
function genDyr(){
  const target=nextAnimal(); const known=ANIMALS.filter(a=>S.animals.includes(a.id));
  const pool = known.length? known.concat(target?[target]:[]) : ANIMALS.slice(0,4);
  const a=pick(pool); const twin={bjorn:"isbjorn",isbjorn:"bjorn"}; const others=shuffle(ANIMALS.filter(x=>x!==a && x.id!==twin[a.id]));
  const k=rnd(3);
  if(k===0){
    const wrongBor=uniq(others.map(x=>x.bor)).filter(b=> borKey(b)!==borKey(a.bor) && !(b.includes("Norge")&&a.bor.includes("Norge")) && !(b.includes("Afrika")&&a.bor.includes("Afrika")) && !(b.includes("Australia")&&a.bor.includes("Australia"))).slice(0,3);
    const D=defOf(a);
    return mk("dyr","hvor bor dyret",`${a.e} Hvor bor ${D}?`, a.bor, wrongBor, {wide:true, explain:`${D[0].toUpperCase()+D.slice(1)}: ${a.bor}.`}); }
  if(k===1){ const f=pick(a.f);
    return mk("dyr","dyrefakta",`Hvilket dyr passer til faktaen?<br><span class="muted">«${esc(maskAnimal(f,a))}»</span>`, `${a.e} ${a.no}`, others.slice(0,3).map(x=>`${x.e} ${x.no}`), {explain:f}); }
  return mk("dyr","hvilket dyr",`Hvilket dyr er dette? <span style="font-size:2.4rem">${a.e}</span>`, a.no, others.slice(0,3).map(x=>x.no), {explain:`Det er ${artOf(a)}! ${a.f[0]}`});
}

let G=null; // pågående økt
function keyOf(q){ return q.key || (q.prompt+"|"+q.answer); }
function buildSession(){
  const plan=shuffle(PLAN); const used=new Set(), usedTema=new Set(); const qs=[];
  for(const s of plan){
    let q, tries=0;
    do{ tries++;
      if(s==="matte") q=genMatte(S.lvl.matte);
      else if(s==="norsk") q=genNorsk(S.lvl.norsk);
      else if(s==="engelsk") q=genEngelsk(S.lvl.engelsk);
      else if(s==="tema") q=genTema(usedTema);
      else q=genDyr();
    } while(used.has(keyOf(q)) && tries<20);
    used.add(keyOf(q)); if(s==="tema") usedTema.add(q.prompt.replace(/<[^>]+>/g,"")); qs.push(q);
  }
  const focus = W() && W().focus && W().focus.matte;
  if(focus==="tresifret"){
    const L=S.lvl.matte;
    const needed=[
      genOppstiltSubtraksjon(L,false,used),
      genOppstiltSubtraksjon(L, L>=3, used),
      genManglerTall(L,used),
      genTekstSubtraksjon(L,used)
    ];
    let mi=0;
    for(let i=0;i<qs.length && mi<needed.length;i++){
      if(qs[i].subj==="matte"){
        used.delete(keyOf(qs[i])); used.add(keyOf(needed[mi])); qs[i]=needed[mi]; mi++;
      }
    }
  } else {
    const want = (focus==="oppstilt") ? 2 : 1;
    let nAdd = qs.filter(q=>q.mode==="addisjon").length;
    for(let i=0;i<qs.length && nAdd<want;i++){
      if(qs[i].subj==="matte" && qs[i].mode!=="addisjon"){
        const q=genOppstiltAddisjon(S.lvl.matte);
        if(!used.has(keyOf(q))){ used.delete(keyOf(qs[i])); used.add(keyOf(q)); qs[i]=q; nAdd++; }
      }
    }
  }
  return qs;
}
function adapt(subj, ok){
  if(!(subj in S.lvl)) return null;
  let msg=null;
  if(ok){ S.run[subj]++; S.miss[subj]=0; if(S.run[subj]>=3 && S.lvl[subj]<MAXLVL){ S.lvl[subj]++; S.run[subj]=0; msg=`⬆️ ${SUBJ[subj].name} nivå ${S.lvl[subj]}!`; } }
  else { S.miss[subj]++; S.run[subj]=0; if(S.miss[subj]>=2 && S.lvl[subj]>1){ S.lvl[subj]--; S.miss[subj]=0; } }
  return msg;
}

let ADD=null;
function setAddHint(msg,bad){
  const el=$("#addHint"); if(!el) return;
  el.textContent=msg; el.classList.toggle("bad", !!bad);
}
function highlightAdd(){
  app.querySelectorAll(".ansbox,.mentebox").forEach(el=>el.classList.remove("on"));
  if(!ADD || ADD.done) return;
  if(ADD.waitMente){
    const el=$(`#mente-${ADD.step+1}`);
    if(el){ el.classList.remove("idle"); el.classList.add("on"); }
  } else {
    const el=$(`#ans-${ADD.cols[ADD.step].place}`);
    if(el) el.classList.add("on");
  }
}
function missAdd(msg){
  ADD.mistakes++; ADD.cellMiss=(ADD.cellMiss||0)+1;
  setAddHint(msg,true); beep(false);
  const el = ADD.waitMente? $(`#mente-${ADD.step+1}`) : $(`#ans-${ADD.cols[ADD.step].place}`);
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),400); }
}
function tapAdd(d){
  if(!ADD || ADD.done || !G || G.results.length>G.i) return;
  const col=ADD.cols[ADD.step];
  if(ADD.waitMente){
    if(d===1){
      const box=$(`#mente-${ADD.step+1}`);
      box.textContent="1"; box.classList.remove("on","idle","shake"); box.classList.add("ok");
      beep(true); ADD.waitMente=false; ADD.step++; ADD.cellMiss=0;
      highlightAdd();
      setAddHint(`Nå ${ADD.cols[ADD.step].name}! Husk menten!`);
    } else {
      const nxt=ADD.cols[ADD.step+1];
      const c=col;
      let msg="Når summen blir 10 eller mer, skriver du 1 i mente.";
      if((ADD.cellMiss||0)>=1) msg=`${c.a} + ${c.b}${c.cin?` + ${c.cin}`:""} = ${c.sum}. Skriv 1 i mente til ${nxt.name}.`;
      missAdd(msg);
    }
    return;
  }
  if(d===col.digit){
    const box=$(`#ans-${col.place}`);
    box.textContent=String(d); box.classList.remove("on","shake"); box.classList.add("ok");
    beep(true); ADD.cellMiss=0;
    if(col.cout && ADD.step<2){
      ADD.waitMente=true; highlightAdd();
      setAddHint(`Skriv 1 i mente til ${ADD.cols[ADD.step+1].name}!`);
    } else if(ADD.step>=2){
      finishAddisjon();
    } else {
      ADD.step++; highlightAdd();
      const n=ADD.cols[ADD.step];
      setAddHint(`Nå ${n.name}!${n.cin?" Husk menten!":""}`);
    }
  } else {
    let msg = col.cin? `Hva blir ${col.a} + ${col.b} + ${col.cin}? Husk menten!` : `Hva blir ${col.a} + ${col.b}?`;
    if((ADD.cellMiss||0)>=1){
      msg = col.cout? `${col.a} + ${col.b}${col.cin?` + ${col.cin}`:""} = ${col.sum}. Skriv ${col.digit}, og ta 1 i mente.`
                    : `${col.a} + ${col.b}${col.cin?` + ${col.cin}`:""} = ${col.sum}. Skriv ${col.digit}.`;
    }
    missAdd(msg);
  }
}
function finishAddisjon(){
  if(!ADD || ADD.done) return;
  ADD.done=true; highlightAdd();
  app.querySelectorAll("#numpad button").forEach(b=>b.disabled=true);
  const ok=ADD.mistakes<=1;
  setAddHint(ok? "Riktig! 🌟" : "Du klarte det!");
  settleQuestion(ok);
}
function onAddKey(e){
  if(!ADD || ADD.done) return;
  if(e.key>="0" && e.key<="9"){ e.preventDefault(); tapAdd(+e.key); }
}
function bindAddisjon(q){
  if(ADD && ADD.keyHandler) window.removeEventListener("keydown", ADD.keyHandler);
  ADD={ q, cols:addCols(q.a,q.b), step:0, waitMente:false, mistakes:0, cellMiss:0, done:false, keyHandler:onAddKey };
  highlightAdd();
  app.querySelectorAll("#numpad button").forEach(b=>b.onclick=()=>tapAdd(+b.dataset.d));
  window.addEventListener("keydown", onAddKey);
}
function unbindAddisjon(){

function updateHjelp(){

  for(const c of SUB.cols){
    const box=$(`#ans-${c.place}`);

function highlightSub(){
  app.querySelectorAll(".ansbox").forEach(el=>el.classList.remove("on"));
  const btn=$("#btnVeksle");
  if(!SUB || SUB.done){ if(btn) btn.hidden=true; return; }
  const col=SUB.cols[SUB.step];
  if(SUB.waitVeksle){
    if(btn){ btn.hidden=false; btn.textContent = `Veksle én ${col.fromUnit} ⇄`; }
  } else {
    if(btn) btn.hidden=true;
    const el=$(`#ans-${col.place}`);
    if(el) el.classList.add("on");
  }
}
function missSub(msg){
  SUB.mistakes++; SUB.cellMiss=(SUB.cellMiss||0)+1;
  setAddHint(msg,true); beep(false);
  const el=$(`#ans-${SUB.cols[SUB.step].place}`);
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),400); }
}
function doVeksle(){
  if(!SUB || SUB.done || !SUB.waitVeksle) return;
  const col=SUB.cols[SUB.step];
  const src=col.place+1;
  const top=$(`#top-${src}`); if(top) top.classList.add("struck");
  const bNext=$(`#borrow-${src}`);
  if(bNext){ bNext.textContent=String(col.newNeighbor); bNext.classList.remove("idle","on"); bNext.classList.add("ok"); }
  const bCur=$(`#borrow-${col.place}`);
  if(bCur){ bCur.textContent="1"; bCur.classList.remove("idle","on"); bCur.classList.add("ok"); }
  beep(true); SUB.waitVeksle=false; SUB.cellMiss=0;
  highlightSub();
  setAddHint(`Nå har du ${col.used} ${col.name}. Hva er ${col.used} − ${col.b}?`);
}
function tapSub(d){
  if(!SUB || SUB.done || !G || G.results.length>G.i) return;
  const col=SUB.cols[SUB.step];
  if(SUB.waitVeksle){
    let msg=`${col.shown} − ${col.b} går ikke. Veksle én ${col.fromUnit} først!`;
    if((SUB.cellMiss||0)>=1) msg=`Trykk på knappen «Veksle én ${col.fromUnit}». Da blir det ${col.used} − ${col.b}.`;
    missSub(msg);
    return;
  }
  if(d===col.digit){
    const box=$(`#ans-${col.place}`);
    box.textContent=String(d); box.classList.remove("on","shake"); box.classList.add("ok");
    beep(true); SUB.cellMiss=0; updateHjelp();
    if(SUB.step>=2){
      finishSubtraksjon();
    } else {
      SUB.step++;
      const n=SUB.cols[SUB.step];
      if(n.needBorrow){
        SUB.waitVeksle=true; highlightSub();
        setAddHint(`${n.shown} − ${n.b} går ikke. Veksle én ${n.fromUnit}!`);
      } else {
        highlightSub();
        setAddHint(`Nå ${n.name}! Hva er ${n.shown} − ${n.b}?`);
      }
    }
  } else {
    let msg = col.needBorrow? `Hva er ${col.used} − ${col.b}?` : `Hva er ${col.shown} − ${col.b}?`;
    if((SUB.cellMiss||0)>=1){
      msg = col.needBorrow
        ? `${col.used} − ${col.b} = ${col.digit}. Skriv ${col.digit}.`
        : `${col.shown} − ${col.b} = ${col.digit}. Skriv ${col.digit}.`;
    }
    missSub(msg);
  }
}
function finishSubtraksjon(){
  if(!SUB || SUB.done) return;
  SUB.done=true; highlightSub();
  app.querySelectorAll("#numpad button").forEach(b=>b.disabled=true);
  const ok=SUB.mistakes<=1;
  setAddHint(ok? "Riktig! 🌟" : "Du klarte det!");
  settleQuestion(ok);
}
function onSubKey(e){
  if(!SUB || SUB.done) return;
  if(e.key>="0" && e.key<="9"){ e.preventDefault(); tapSub(+e.key); }
}
function bindSubtraksjon(q){
  if(SUB && SUB.keyHandler) window.removeEventListener("keydown", SUB.keyHandler);
  const cols=subCols(q.a,q.b);
  SUB={ q, cols, step:0, waitVeksle:!!cols[0].needBorrow, mistakes:0, cellMiss:0, done:false, keyHandler:onSubKey };
  if(SUB.waitVeksle){
    const c=cols[0];
    setAddHint(`${c.shown} − ${c.b} går ikke. Veksle én ${c.fromUnit}!`);
  }
  highlightSub();
  app.querySelectorAll("#numpad button").forEach(b=>b.onclick=()=>tapSub(+b.dataset.d));
  const vb=$("#btnVeksle"); if(vb) vb.onclick=doVeksle;
  window.addEventListener("keydown", onSubKey);
}

function highlightMiss(){

function missMiss(msg){

function tapMiss(d){
  if(!MISS || MISS.done || !G || G.results.length>G.i) return;
  const want=+MISS.digits[MISS.step];
  if(d===want){
    const box=$(`#miss-${MISS.step}`);

  } else {
    let msg="Prøv et annet siffer.";
    if((MISS.cellMiss||0)>=1) msg=`Tallet som mangler er ${MISS.q.answer}. Skriv ${want}.`;
    else if(MISS.step===0) msg=`Hva er ${MISS.q.a} − ${MISS.q.result}?`;

  }
}
function finishMangler(){

}
function onMissKey(e){

}
function bindMangler(q){

function bindSpeak(){ app.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); speak(b.dataset.say); }); }
function settleQuestion(ok){
  const q=G.qs[G.i]; if(G.results.length>G.i) return;
  G.results.push(ok); S.answered++; if(ok) S.correct++;
  let gained=0;
  if(ok){ G.combo++; gained = 10 + (q.subj in S.lvl ? 2*(S.lvl[q.subj]-1) : 0); if(G.combo%3===0) gained+=5; }
  else G.combo=0;
  G.points+=gained;
  const lm=adapt(q.subj, ok); if(lm) G.lvlMsgs.push(lm);
  save(); beep(ok);
  const cheers=["Mål! ⚽","Perfekt piruett! 💃","Rett i blinken! 🎯","Applaus! 👏","Som en filmstjerne! 🎬","Supert! 🌟"];
  const last = G.i===G.qs.length-1;
  const failMsg = (q.mode==="addisjon"||q.mode==="subtraksjon"||q.mode==="mangler")
    ? `Du klarte det til slutt! Riktig svar er <b>${esc(q.answer)}</b>.`
    : `Ikke helt. Riktig svar: <b>${esc(q.answer)}</b>`;
  $("#fb").innerHTML = `<div class="feedback ${ok?"ok":"bad"}">
      ${ok? `${pick(cheers)} <span class="muted">+${gained} poeng${G.combo>=3&&G.combo%3===0?" (3 på rad-bonus!)":""}</span>` : failMsg}
      ${q.explain? `<div class="small" style="margin-top:6px;font-weight:500">${esc(q.explain)}</div>`:""}
      ${q.say && !q.sayInPrompt? `<div style="margin-top:6px">Hør det på engelsk: ${speakBtn(q.say)}</div>`:""}
      ${lm? `<div style="margin-top:6px"><span class="badge">${esc(lm)}</span></div>`:""}
    </div>
    <button class="btn" id="btnNext">${last? "Se resultatet 🏁" : "Neste ➜"}</button>`;
  bindSpeak();
  $("#btnNext").onclick=()=>{ G.i++; if(G.i>=G.qs.length) finishSession(); else renderQuestion(); };
  $("#btnNext").scrollIntoView({behavior:"smooth", block:"nearest"});
}
function answer(k){
  const q=G.qs[G.i]; if(G.results.length>G.i) return;
  const ok = q.choices[k]===q.answer;
  const btns=app.querySelectorAll(".choice");
  btns.forEach((b,j)=>{ b.disabled=true; if(q.choices[j]===q.answer) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); });
  settleQuestion(ok);
}
function markPlayedToday(){
  const t=dayStr(); if(S.lastDay===t) return;
  S.streak = (S.lastDay===addDays(t,-1)) ? S.streak+1 : 1;

}
function finishSession(){
  const right=G.results.filter(Boolean).length, idx=leagueFor(right);
  const prevLast=S.lastLeague, prevBest=S.bestLeague;
  const opprykk = prevLast>=0 && idx>prevLast, nedrykk = prevLast>=0 && idx<prevLast;

  const unlocked=[];
  const a1=nextAnimal(); if(a1){ S.animals.push(a1.id); unlocked.push(a1); }
  if(record || idx===4){ const a2=nextAnimal(); if(a2){ S.animals.push(a2.id); unlocked.push(a2); } }
  S.points+=G.points; S.sessions++; S.lastLeague=idx; S.bestLeague=Math.max(S.bestLeague,idx);

        <p class="small">🌍 ${esc(a.bor)}</p><p class="small">💡 ${esc(a.f[0])}</p></div>`).join("")}
    <div class="card"><h3>Ligastigen</h3>${ladderHTML(idx)}</div>
    <button class="btn sun" id="btnAgain">▶ Ny safari</button>

  window.scrollTo(0,0);

  unbindAddisjon();
  G=null;
}
function confetti(n){ const box=$("#confetti"); const em=["⚽","💃","🎬","⭐","🎉","🦁","🏆","🩰"];

function renderGloser(){
  window.scrollTo(0,0); $("#confetti").innerHTML="";
  const w=W(), g=w.gloser, best=(S.gloser[currentWeek()]||{}).best;
  app.innerHTML = `<div class="card"><h2>💬 Ukens gloser</h2>
      <p class="muted small">${esc(w.label)} · ${esc(g.tema)} · ${g.words.length} ord. Trykk 🔊 for å høre ordet.</p>
      <div class="row"><button class="btn" id="btnFlash">🃏 Flashcards</button><button class="btn sun" id="btnGQuiz">✏️ Glosequiz</button></div>
      <p class="muted small">${best!==undefined? `Beste quiz: ${best} av 8 ${gloseStars(currentWeek())}` : "Quizen gir ekstra poeng og stjerner. Den teller ikke i ligaen."}</p></div>
    <div class="card"><table class="glose">${g.words.map(x=>`<tr><td class="ge">${x.e}</td><td><b>${esc(x.en)}</b><br><span class="muted small">${esc(x.no)}</span></td><td class="gs">${speakBtn(x.en)}</td></tr>`).join("")}</table></div>
    <div class="card"><h3>Fraser</h3><table class="glose">${g.phrases.map(x=>`<tr><td><b>${esc(x.en)}</b><br><span class="muted small">${esc(x.no)}</span></td><td class="gs">${speakBtn(x.en)}</td></tr>`).join("")}</table></div>
    <button class="btn ghost" id="btnHome">🏠 Forsiden</button>`;
  bindSpeak();
  $("#btnFlash").onclick=()=>renderFlash(shuffle(g.words),0,false);
  $("#btnGQuiz").onclick=startGloseQuiz;
  $("#btnHome").onclick=renderHome;
}
function renderFlash(list,i,back){
  const x=list[i];
  app.innerHTML = `<div class="qtop"><span class="tag t-engelsk">🃏 Flashcards</span><span class="muted small">${i+1} / ${list.length}</span><button class="iconbtn" id="btnX" aria-label="Lukk">✕</button></div>
    <button class="flash ${back?"back":""}" id="card">${back? `<span class="fe">${x.e}</span><b>${esc(x.no)}</b><small>på norsk</small>` : `<span class="fe">${x.e}</span><b>${esc(x.en)}</b><small>trykk for å snu</small>`}</button>
    <div class="center">${speakBtn(x.en)}</div>
    <div class="row"><button class="btn ghost" id="bPrev" ${i===0?"disabled":""}>⬅ Forrige</button><button class="btn" id="bNext">${i===list.length-1?"Ferdig ✔":"Neste ➡"}</button></div>`;
  bindSpeak();
  $("#card").onclick=()=>renderFlash(list,i,!back);
  $("#bPrev").onclick=()=>{ if(i>0) renderFlash(list,i-1,false); };
  $("#bNext").onclick=()=>{ if(i<list.length-1) renderFlash(list,i+1,false); else renderGloser(); };
  $("#btnX").onclick=renderGloser;
}
let GQ=null;
function gloseQuestions(g){
  return shuffle(g.words).slice(0,8).map(x=>{ const others=shuffle(g.words.filter(y=>y!==x)); const k=rnd(3);
    if(k===0) return mk("engelsk","ukens gloser",`Hva betyr «${esc(x.en)}»?`, x.no, others.map(y=>y.no), {say:x.en, sayInPrompt:true, explain:`${x.en} = ${x.no}`});
    if(k===1) return mk("engelsk","ukens gloser",`Hva heter «${esc(x.no)}» på engelsk?`, x.en, others.map(y=>y.en), {say:x.en, explain:`${x.no} = ${x.en}`});
    return mk("engelsk","ukens gloser",`Hva er dette på engelsk? <span style="font-size:2.4rem">${x.e}</span>`, x.en, others.filter(y=>y.e!==x.e).map(y=>y.en), {say:x.en, explain:`${x.e} = ${x.en} (${x.no})`}); });
}
function startGloseQuiz(){ GQ={qs:gloseQuestions(W().gloser), i:0, right:0, done:false}; renderGQ(); }
function renderGQ(){
  window.scrollTo(0,0); const q=GQ.qs[GQ.i];
  app.innerHTML = `<div class="qtop"><span class="tag t-engelsk">✏️ Glosequiz</span><span class="muted small">${GQ.i+1} / ${GQ.qs.length}</span><button class="iconbtn" id="btnX" aria-label="Lukk">✕</button></div>
    <div class="card"><div class="small muted" style="margin-bottom:6px">Teller ikke i ligaen · ${GQ.right} riktig${GQ.right===1?"":"e"}</div>
      <div class="prompt">${q.prompt} ${q.sayInPrompt? speakBtn(q.say):""}</div>
      <div class="choices">${q.choices.map((c,k)=>`<button class="choice" data-k="${k}">${esc(c)}</button>`).join("")}</div><div id="fb"></div></div>`;
  bindSpeak(); $("#btnX").onclick=renderGloser;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(app.querySelector(".choice:disabled")) return; const k=+b.dataset.k, ok=q.choices[k]===q.answer; if(ok) GQ.right++;
    app.querySelectorAll(".choice").forEach((x,j)=>{ x.disabled=true; if(q.choices[j]===q.answer) x.classList.add("right"); else if(j===k) x.classList.add("wrong"); });
    beep(ok);
    $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}">${ok?"Riktig! 🎉":`Riktig svar: <b>${esc(q.answer)}</b>`}<div class="small" style="margin-top:6px;font-weight:500">${esc(q.explain)} ${speakBtn(q.say)}</div></div>
      <button class="btn" id="bN">${GQ.i===GQ.qs.length-1?"Se resultatet 🏁":"Neste ➜"}</button>`;
    bindSpeak(); $("#bN").onclick=()=>{ GQ.i++; if(GQ.i>=GQ.qs.length) finishGQ(); else renderGQ(); };
  });
}
function finishGQ(){
  const w=currentWeek(), pts=GQ.right*5; const prev=S.gloser[w]||{best:0,played:0};
  const rec = GQ.right>prev.best;
  S.gloser[w]={best:Math.max(prev.best,GQ.right), played:(prev.played||0)+1}; S.points+=pts; save();
  app.innerHTML=`<div class="card center"><h2>✏️ ${GQ.right} av ${GQ.qs.length} riktige</h2>
      <p style="font-size:2rem;margin:6px 0">${"⭐".repeat(GQ.right>=8?3:GQ.right>=6?2:GQ.right>=4?1:0) || "💪"}</p>
      <p>+${pts} poeng${rec?" · ny gloserekord!":""}</p><p class="muted small">Glosequizen påvirker ikke ligaen eller streaken.</p></div>
    <button class="btn sun" id="bAgain">🔁 Prøv igjen</button><button class="btn ghost" id="bBack">💬 Tilbake til glosene</button>`;
  if(GQ.right>=6) confetti(25);
  $("#bAgain").onclick=startGloseQuiz; $("#bBack").onclick=renderGloser; GQ=null;
}

/* ---------- innstillinger ---------- */
function renderSettings(){
  window.scrollTo(0,0);
  const ws=weekNums();
  app.innerHTML = `<div class="card"><h2>⚙️ Innstillinger</h2>
      <div class="toggle"><span>Lyd</span><input type="checkbox" id="chkSound" ${S.sound?"checked":""}></div>
      <div class="toggle"><span>Ukens tema</span><select id="selWeek"><option value="">Automatisk (uke ${isoWeek()})</option>
        ${ws.map(w=>`<option value="${w}" ${S.week===w?"selected":""}>${esc(WEEK_CONTENT[w].label)}</option>`).join("")}</select></div>
      <p class="muted small">Fremgangen lagres bare på denne enheten (i nettleseren).</p>
      <button class="btn ghost" id="btnReset">🗑️ Start helt på nytt</button></div>
    <button class="btn" id="btnHome">🏠 Forsiden</button>`;
  $("#chkSound").onchange=e=>{ S.sound=e.target.checked; save(); };
  $("#selWeek").onchange=e=>{ S.week=e.target.value? Number(e.target.value) : null; save(); };
  $("#btnReset").onclick=()=>{ if(confirm("Er du sikker? Dyr, poeng, ligaer og streak blir slettet.")){ S=JSON.parse(JSON.stringify(defaultState)); save(); renderHome(); } };
  $("#btnHome").onclick=renderHome;
}

$("#btnSettings").onclick=()=>{ if(G && !confirm("Avslutte safarien?")) return; unbindAddisjon(); renderSettings(); };
$("#homeTitle").onclick=()=>{ if(G && !confirm("Avslutte safarien?")) return; unbindAddisjon(); renderHome(); };
if("speechSynthesis" in window){ findVoice(); speechSynthesis.onvoiceschanged=findVoice; }
renderHome();
</script>
